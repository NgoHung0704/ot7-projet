include:
  - path: docker/airflow/docker-compose.yml
    env_file:
      - .env
      - docker/mongo/.env
      - docker/airflow/.env
  - path: docker/mongo/docker-compose.yml
    env_file:
      - .env
      - docker/mongo/.env
  - path: docker/postgres/compose.yml
    env_file:
      - .env
      - docker/postgres/.env

networks:
  airflow:
    driver: bridge
  mongo:
    driver: bridge
  common-inner-network:
    driver: bridge