# Disposable integration database; never point tests at the project's warehouse.
services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: warehouse_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d warehouse_test"]
      interval: 2s
      timeout: 3s
      retries: 30
